id = "didimean"
summary = "Find the word you almost remembered."
description = "Suggests the most likely English word from a misspelling, phonetic guess, fragment, or usage clue, with pronunciation, meaning, and example use."
command = "didimean"
kind = "ai-text"
requires_commands = ["apfel", "awk"]
supported_shells = ["fish", "zsh"]

[help]
usage = "didimean WORD_OR_USAGE_CLUE"
examples = ["didimean susinct", "didimean 'word for saying a lot in few words'", "didimean accomodate"]

[input]
mode = "rest"
name = "clue"
required = true

[prompt]
system = "Find one best English word for a misspelling, phonetic guess, fragment, or meaning clue. Return only the answer. First line: Did you mean:. Second line blank. After that, exactly three lines: word * pronunciation; short definition; short example sentence. The asterisk belongs inside the word line, not on its own line. Use any provided local dictionary candidate exactly as the word. Do not print the input typo as the word. Do not print labels, notes, bullets, markdown, alternatives, or Example: prefixes."
template = "Find likely English words for: {{input}}"
max_context_tokens = 4096
max_input_bytes = 1400
max_output_tokens = 96

[output]
mode = "text"

[hooks]
build_prompt = "hooks/build_prompt.sh"

id = "didimean"
summary = "Find the word you almost remembered."
description = "Suggests the most likely English word from a misspelling, phonetic guess, fragment, or usage clue, with pronunciation, meaning, and example use."
command = "didimean"
kind = "ai-text"
requires_commands = ["apfel"]
supported_shells = ["fish", "zsh"]

[help]
usage = "didimean WORD_OR_USAGE_CLUE"
examples = ["didimean susinct", "didimean 'word for saying a lot in few words'", "didimean accomodate"]

[input]
mode = "rest"
name = "clue"
required = true

[prompt]
system = "Find one best English word for a misspelling, phonetic guess, fragment, or meaning clue. Return exactly five lines and nothing else. Line 1 must be Did you mean:. Line 2 must be blank. Line 3 must be the best word, then space, star, space, then a simple pronunciation. Line 4 must be a short meaning. Line 5 must be a short example sentence using the word. Stop after line 5. Do not list alternatives. Do not repeat. Do not use bullets, markdown, labels, or Example: prefixes."
template = "Find likely English words for: {{input}}"
max_context_tokens = 4096
max_input_bytes = 700
max_output_tokens = 80

[output]
mode = "text"

[hooks]
build_prompt = "hooks/build_prompt.sh"

id = "didimean"
summary = "Find the word you almost remembered."
description = "Suggests the most likely English word from a misspelling, phonetic guess, fragment, or usage clue, with pronunciation, meaning, and example use."
command = "didimean"
kind = "ai-text"
requires_commands = ["apfel"]
supported_shells = ["fish", "zsh"]

[help]
usage = "didimean WORD_OR_USAGE_CLUE"
examples = ["didimean susinct", "didimean 'word for saying a lot in few words'", "didimean accomodate"]

[input]
mode = "rest"
name = "clue"
required = true

[prompt]
system = "Find one best English word for a misspelling, phonetic guess, fragment, or meaning clue. Return only the formatted answer. Use exactly this shape: Did you mean:, blank line, word * pronunciation, meaning, example sentence. The only asterisk may be the separator between word and pronunciation. Do not start any line with *, -, or a number. Do not put pronunciation on its own line. Do not write labels, notes, markdown, alternatives, or Example: prefixes. Stop after the example sentence."
template = "Find likely English words for: {{input}}"
max_context_tokens = 4096
max_input_bytes = 700
max_output_tokens = 60

[output]
mode = "text"

[hooks]
build_prompt = "hooks/build_prompt.sh"

id = "didimean"
summary = "Find the word you almost remembered."
description = "Suggests likely English words from a misspelling, phonetic guess, fragment, or usage clue, with pronunciation, meaning, and example use."
command = "didimean"
kind = "ai-text"
requires_commands = ["apfel"]
supported_shells = ["fish", "zsh"]

[help]
usage = "didimean WORD_OR_USAGE_CLUE"
examples = ["didimean susinct", "didimean 'word for saying a lot in few words'", "didimean accomodate"]

[input]
mode = "rest"
name = "clue"
required = true

[prompt]
system = "You help recover English words from misspellings, phonetic approximations, fragments, or usage clues. Output plain text only. Start with exactly: Did you mean: Then a blank line. Suggest the 3 most likely English words, ranked best first, unless fewer than 3 are plausible. For each suggestion output exactly 3 lines: word * phonetics, concise meaning, natural example sentence. Separate suggestions with one blank line. Use IPA or simple pronunciation in the phonetics slot, whichever is clearest. The example sentence must contain the suggested word. Prefer common words over obscure words. If the input is already a correctly spelled English word, put that word first and then close alternatives only if useful. No markdown bullets, no numbering, no extra commentary."
template = "Find likely English words for: {{input}}"
max_context_tokens = 4096
max_input_bytes = 1024
max_output_tokens = 320

[output]
mode = "text"

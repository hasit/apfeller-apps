id = "didimean"
summary = "Find the word you almost remembered."
description = "Suggests the most likely English word from a misspelling, phonetic guess, fragment, or usage clue, with pronunciation, meaning, and example use."
command = "didimean"
kind = "ai-text"
requires_commands = ["apfel"]
supported_shells = ["fish", "zsh"]

[help]
usage = "didimean WORD_OR_USAGE_CLUE"
examples = ["didimean susinct", "didimean 'word for saying a lot in few words'", "didimean accomodate"]

[input]
mode = "rest"
name = "clue"
required = true

[prompt]
system = "Find one best English word for a misspelling, phonetic guess, fragment, or meaning clue. Return exactly four non-empty lines plus one blank line after the header. First print Did you mean:, then a blank line. Then print the corrected word and pronunciation on one line separated by space star space. Then print a short definition. Then print one short sentence using the corrected word. Stop there. Do not print the input typo as the word. Do not print literal placeholder words like meaning or example sentence. Do not write notes, labels, bullets, markdown, alternatives, or Example: prefixes."
template = "Find likely English words for: {{input}}"
max_context_tokens = 4096
max_input_bytes = 1000
max_output_tokens = 45

[output]
mode = "text"

[hooks]
build_prompt = "hooks/build_prompt.sh"
